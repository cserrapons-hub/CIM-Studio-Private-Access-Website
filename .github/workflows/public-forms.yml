name: Public form regression
on:
  pull_request:
    branches: [design/private-access-v1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  forms:
    name: Public forms regression
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated browser test tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/cim-form-tools" --no-audit --no-fund --ignore-scripts playwright@1.56.1
          "$RUNNER_TEMP/cim-form-tools/node_modules/.bin/playwright" install --with-deps chromium
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/cim-form-tools/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Build the published assets
        run: sh scripts/build-preview.sh
      - name: Unit and server security tests
        run: npm test
      - name: Public form browser regression (all providers simulated)
        run: node scripts/test-public-forms.mjs
